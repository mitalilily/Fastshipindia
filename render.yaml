databases:
  - name: fastship-postgres
    databaseName: fastship
    user: fastship

services:
  - type: web
    runtime: static
    name: fastship-piwy
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_CLIENT_APP_URL
        value: https://fastshipindia-1.onrender.com
      - key: VITE_AUTH_APP_URL
        value: https://fastshipindia-1.onrender.com/#/login
      - key: VITE_ADMIN_APP_URL
        value: https://fastshipadmin.onrender.com
      - key: VITE_ADMIN_AUTH_URL
        value: https://fastshipadmin.onrender.com/#/auth/signin
      - key: VITE_API_URL
        value: https://fastshipindia.onrender.com/api
      - key: VITE_APP_SOCKET_URL
        value: https://fastshipindia.onrender.com
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_PUBLIC_GEOAPIFY_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: static
    name: fastshipindia-1
    rootDir: express-magic/courier-cart-client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://fastshipindia.onrender.com/api
      - key: VITE_APP_SOCKET_URL
        value: https://fastshipindia.onrender.com
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_PUBLIC_GEOAPIFY_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    runtime: static
    name: fastshipadmin
    rootDir: express-magic/admin-dashboard
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://fastshipindia.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://fastshipindia.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: docker
    name: fastshipindia
    rootDir: express-magic/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://fastshipindia.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fastship-piwy.onrender.com,https://fastshipindia-1.onrender.com,https://fastshipadmin.onrender.com
      - key: FRONTEND_URL
        value: https://fastshipindia-1.onrender.com
      - key: AUTH_OTP_DELIVERY
        value: screen
      - key: AUTO_MIGRATE_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fastship-postgres
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COURIER_SECRET_KEY
        generateValue: true
      - key: DELHIVERY_B2B_USERNAME
        sync: false
      - key: DELHIVERY_B2B_PASSWORD
        sync: false
      - key: DELHIVERY_B2B_CLIENT_ID
        sync: false
      - key: DELHIVERY_B2B_WAREHOUSE_ID
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: PROD_BUCKET
        sync: false
      - key: R2_IR_BUCKET
        sync: false
      - key: UPLOAD_PROXY_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_SEED_EMAIL
        value: admin@fastship.in
      - key: ADMIN_FORCE_PASSWORD_RESET
        value: "false"
